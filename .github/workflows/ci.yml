name: CI

on:
  push:
    branches: [ develop, master ]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both engines, because they disagree on SQL that matters here: the
        # seeder's upsert used a MySQL 8.0.19+ row alias that MariaDB rejects,
        # and testing only MySQL let that reach production.
        include:
          - php-version: '8.4'
            database: mysql:8.4
            database-name: MySQL 8.4
            health-cmd: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - php-version: '8.4'
            database: mariadb:11.4
            database-name: MariaDB 11.4
            health-cmd: healthcheck.sh --connect --innodb_initialized

    name: PHP ${{ matrix.php-version }} / ${{ matrix.database-name }}

    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tb-install
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health-cmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tb-install
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_ENV: common
      APP_NAME: TripBuilder
      AWS_CLOUDFRONT: example.cloudfront.net
      API_URL: http://localhost/api
      API_TOKEN: ci-token
      API_ACCEPTED_TOKENS: ci-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, pdo_mysql, curl, mbstring, gd, simplexml
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint (parallel-lint)
        run: composer lint

      - name: Static analysis (PHPStan)
        run: composer stan

      - name: Code style (PHP-CS-Fixer)
        run: composer cscheck

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          APP_NAME=TripBuilder
          APP_ENV=common
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=tb-install
          DB_USERNAME=root
          DB_PASSWORD=root
          AWS_CLOUDFRONT=example.cloudfront.net
          API_URL=http://localhost/api
          API_TOKEN=ci-token
          API_ACCEPTED_TOKENS=ci-token
          EOF

      - name: Provision database schema + seed data
        run: php noah app:install --no-ansi

      # Every migration, for real, on a database built from nothing.
      #
      # Until E10.1 (#148) this never happened: seven migrations existed and CI
      # had run none of them. 0007 rewrote 547,000 production rows having failed
      # twice locally -- once on an invalid zero date, once on a NOT NULL column
      # added to a populated table -- and neither failure was a shape any build
      # could have caught, because no build ran it.
      #
      # Before the tests rather than after, so the suite runs against a migrated
      # schema, which is what production has.
      - name: Apply every migration
        run: php noah db:migrate --no-ansi

      # The help articles have no seeder CSV on purpose, so app:install does
      # not create them -- see src/Noah/Articles/Import.php for why, and the
      # README's install steps, which say the same thing to a person. That
      # makes this the second half of the install rather than an extra, and
      # the integration tests read the rows it writes.
      - name: Import the help articles
        run: php noah articles:import --no-ansi

      # The integration tests search real routes on real dates and skip
      # themselves when a route has nothing, so without generated flights the
      # whole integration suite passes by doing nothing. The count is a density
      # trade-off, not a fixture: a specific route on a specific day only has
      # itineraries once the network is dense enough to connect through.
      - name: Generate flights for the integration tests
        run: php noah flights:add 200000 --no-ansi --no-interaction

      - name: Tests (unit + integration)
        run: composer test

      # Every command boots, connects, and survives the data CI has (E10.1,
      # #148). Three of fifteen were ever run here; the rest could stop working
      # for a release and nothing would say so until somebody typed one on a
      # server.
      #
      # After the tests, so a command that breaks fails its own step rather than
      # leaving the suite to fail confusingly on data it changed.
      #
      # Read-only where a flag offers it, and genuinely destructive nowhere:
      # `airside:prune` and `db:prune` list unless given --force, and
      # `flights:cleaning` deletes flights that have already departed, of which
      # a freshly generated database has none.
      - name: Every noah command runs
        run: |
          set -euo pipefail

          php noah db:migrate --dry-run --no-ansi
          php noah currency:rates --dry-run --no-ansi
          php noah articles:import --dry-run --no-ansi
          php noah airside:import --dry-run --no-ansi
          php noah flights:cabins --dry-run --no-ansi
          php noah flights:realign --dry-run --no-ansi
          php noah flights:reprice --dry-run --no-ansi
          php noah flights:cleaning --no-ansi
          php noah db:prune --no-ansi
          php noah schedule:run --pretend --no-ansi

          # Writes a real dump, which is the only way to find out whether
          # mysqldump is reachable and the credentials file is accepted. The
          # password reaches it through --defaults-extra-file and must not
          # appear in the arguments; DumpTest asserts the shape, this asserts
          # that the shape works.
          php noah db:backup --no-ansi
          test -s "$(ls -1 backups/*.sql.gz | head -1)"

          # Boots and refuses, rather than boots and clears. The argument skips
          # the table prompt; --no-interaction answers no to both confirmations.
          php noah db:clear rate_limits --no-interaction --no-ansi

      # Separately, because it must *fail*.
      #
      # With no distribution configured there is no bucket to sweep, and the
      # command says so and exits non-zero rather than sweeping something else.
      # That guard is the reason it cannot join the sweep above: CI sets
      # AWS_CLOUDFRONT but no credentials, so a real run would reach S3 and get
      # nothing useful.
      #
      # The reason is checked and not just the exit code. Without credentials
      # this command exits non-zero either way -- once for no distribution and
      # once for no keys -- so a step that only read the status would pass
      # whatever `Cdn` answered, which is exactly how the bug this step was
      # written alongside stayed invisible.
      - name: airside:prune refuses when there is no distribution
        env:
          AWS_CLOUDFRONT: ''
        run: |
          if php noah airside:prune --no-ansi > "$RUNNER_TEMP/prune.log" 2>&1; then
            cat "$RUNNER_TEMP/prune.log"
            echo "::error::airside:prune should refuse with no distribution configured."
            exit 1
          fi

          if ! grep -q 'No distribution is configured' "$RUNNER_TEMP/prune.log"; then
            cat "$RUNNER_TEMP/prune.log"
            echo "::error::airside:prune refused, but not because the distribution is missing."
            exit 1
          fi
