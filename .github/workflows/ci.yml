name: CI

on:
  push:
    branches: [ develop, master ]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both engines, because they disagree on SQL that matters here: the
        # seeder's upsert used a MySQL 8.0.19+ row alias that MariaDB rejects,
        # and testing only MySQL let that reach production.
        include:
          - php-version: '8.4'
            database: mysql:8.4
            database-name: MySQL 8.4
            health-cmd: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - php-version: '8.4'
            database: mariadb:11.4
            database-name: MariaDB 11.4
            health-cmd: healthcheck.sh --connect --innodb_initialized

    name: PHP ${{ matrix.php-version }} / ${{ matrix.database-name }}

    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tb-install
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health-cmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tb-install
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_ENV: common
      APP_NAME: TripBuilder
      AWS_CLOUDFRONT: example.cloudfront.net
      API_URL: http://localhost/api
      API_TOKEN: ci-token
      API_ACCEPTED_TOKENS: ci-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, pdo_mysql, curl, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint (parallel-lint)
        run: composer lint

      - name: Static analysis (PHPStan)
        run: composer stan

      - name: Code style (PHP-CS-Fixer)
        run: composer cscheck

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          APP_NAME=TripBuilder
          APP_ENV=common
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=tb-install
          DB_USERNAME=root
          DB_PASSWORD=root
          AWS_CLOUDFRONT=example.cloudfront.net
          API_URL=http://localhost/api
          API_TOKEN=ci-token
          API_ACCEPTED_TOKENS=ci-token
          EOF

      - name: Provision database schema + seed data
        run: php noah app:install --no-ansi

      - name: Tests (unit + integration)
        run: composer test
