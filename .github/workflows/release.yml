name: Release

# Tags and publishes a release when a pull request is merged into develop.
# The bump comes from a label on the PR — release:major / release:minor /
# release:patch, defaulting to patch — so commit messages stay prose.
# Add the `no-release` label to merge without cutting a release.

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: write

# Two PRs merged close together must not read the same "latest tag".
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true
      && !contains(github.event.pull_request.labels.*.name, 'no-release')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: the next version is derived from the last one.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Work out the next version
        id: version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          case ",${LABELS}," in
            *,release:major,*) level=major ;;
            *,release:minor,*) level=minor ;;
            *)                 level=patch ;;
          esac

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"

          case "$level" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="v${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::error::Tag ${next} already exists — refusing to overwrite it."
            exit 1
          fi

          echo "Bumping ${latest} -> ${next} (${level})"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "previous=${latest}" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail

          # Everything landing in this release: the commits since the last tag,
          # oldest first. Merge commits are left out — their subjects name the
          # branch, not the change.
          if git rev-parse -q --verify "refs/tags/${PREVIOUS}" >/dev/null; then
            range="${PREVIOUS}..HEAD"
          else
            range="HEAD"
          fi

          {
            echo "## What's Changed"
            echo

            # Committer date rather than author date: git records no push time,
            # and the committer stamp is when the commit reached this history.
            TZ=UTC git log --no-merges --reverse \
              --date=format:'%Y-%m-%d %H:%M' \
              --pretty=format:'- %s — %cd UTC' \
              "$range"

            echo
          } > release-notes.md

          # grep exits 1 when it counts nothing, which `set -e` would take for
          # a failure rather than the answer it is.
          listed=$(grep -c '^- ' release-notes.md || true)

          if [ "$listed" -eq 0 ]; then
            echo "- No commits in this release" >> release-notes.md
          fi

          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # Title is the version and nothing else; the notes carry the detail.
          gh release create "$TAG" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "$TAG" \
            --notes-file release-notes.md

      - name: Summary
        run: |
          echo "Released **${{ steps.version.outputs.tag }}** from PR #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
