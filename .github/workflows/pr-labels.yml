name: PR labels

# Merging into develop cuts a release (see release.yml). The version comes from
# the calendar now rather than from a label, so none of these labels changes
# what the tag will be. They stay for two reasons: `no-release` is what stops a
# release being cut at all, and the other three classify a pull request so it
# can be found again later. Requiring exactly one keeps that deliberate — a
# pull request must carry one before it can merge.
#
# Failing this check only *blocks* a merge once it is added as a required
# status check in the branch protection rules for develop.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
    branches: [develop]

jobs:
  release-label:
    name: Release label
    runs-on: ubuntu-latest

    steps:
      - name: Require exactly one release label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          found=""
          for label in release:major release:minor release:patch no-release; do
            case ",${LABELS}," in
              *",${label},"*) found="${found} ${label}" ;;
            esac
          done

          count=$(echo $found | wc -w | tr -d ' ')

          if [ "$count" -eq 1 ]; then
            echo "Release label:${found}"
            echo "Release label:${found}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$count" -eq 0 ]; then
            echo "::error::This pull request has no release label. Add one of"\
                 "release:major, release:minor or release:patch to say what kind"\
                 "of change this is — or no-release to merge without cutting a"\
                 "release at all. The version itself comes from the calendar."
          else
            echo "::error::This pull request has more than one release label"\
                 "(${found# }). Keep exactly one so the change has a single"\
                 "classification, and so no-release cannot be contradicted."
          fi

          exit 1
